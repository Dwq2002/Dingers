name: Season Final Email (one-off)

# Sends email/final_2026.html once to the league. The marker file
# email/final_2026_sent.txt stops a second send; force=true overrides.
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Send even if the final email already went out"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: final-email
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Already sent?
        id: guard
        run: |
          if [ "${{ inputs.force }}" != "true" ] && [ -f email/final_2026_sent.txt ]; then
            echo "Final email already sent on $(cat email/final_2026_sent.txt); skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Send email
        if: steps.guard.outputs.skip == 'false'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.MAIL_USER }}
          password: ${{ secrets.MAIL_PASS }}
          subject: "Dingers 2026 is final: Jack wins, Swank takes last"
          to: "qwd2002@gmail.com, rhinoswank87@gmail.com,jteheng@gmail.com,ethan.hughes713@gmail.com,bespey80@gmail.com"
          from: "DingerBot445 <${{ secrets.MAIL_USER }}>"
          secure: false
          html_body: file://email/final_2026.html

      - name: Record send
        if: steps.guard.outputs.skip == 'false'
        run: |
          date -u +%F > email/final_2026_sent.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add email/final_2026_sent.txt
          git commit -m "Mark final 2026 email sent [skip ci]"
          git pull --rebase --autostash origin main && git push
