name: Daily Notebook Run

permissions:
  contents: write


# Only one run at a time. A second trigger waits for the first to finish,
# so the "already sent today" guard sees the first run's commit and skips.
concurrency:
  group: daily-report
  cancel-in-progress: false

on:
  schedule:
    # GitHub cron is best-effort and usually fires 1-5 hours late, worst at the
    # top of the hour. Scheduling early (04:07 America/Chicago CDT) with several
    # retries gets the email out by ~07:00 most days. The guard keeps it to one send.
    - cron: "7 9 * * *"
    - cron: "37 9 * * *"
    - cron: "7 10 * * *"
    - cron: "37 10 * * *"
    - cron: "7 11 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Send even if today's report already went out"
        type: boolean
        default: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # One email per day, no matter how many times this workflow fires
      # (late crons, the retry cron, or an outside trigger).
      - name: Already sent today?
        id: guard
        run: |
          if [ "${{ inputs.force }}" != "true" ] && [ -f "data/daily/points_$(date -u +%F).csv" ]; then
            echo "Report for $(date -u +%F) already committed; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip == 'false'
        with:
          python-version: "3.11"

      - run: pip install papermill jupyter nbconvert Pillow
        if: steps.guard.outputs.skip == 'false'

      - name: Execute notebook (inject date)
        if: steps.guard.outputs.skip == 'false'
        run: papermill Dingers_2026.ipynb output.ipynb -p RUN_DATE "$(date -u +%F)"

      - name: Upload executed notebook (optional)
        if: steps.guard.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: executed-notebook
          path: output.ipynb

      - name: Send email
        if: steps.guard.outputs.skip == 'false'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.MAIL_USER }}
          password: ${{ secrets.MAIL_PASS }}
          subject: Daily Dingers Report # <-- guaranteed defined
          to: "qwd2002@gmail.com, rhinoswank87@gmail.com,jteheng@gmail.com,ethan.hughes713@gmail.com,bespey80@gmail.com"
          from: "DingerBot445 <${{ secrets.MAIL_USER }}>"
          secure: false
          html_body: file://summary.html
